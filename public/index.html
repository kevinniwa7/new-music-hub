<h2>Music Library</h2>
<div id="songs"></div>

<script>
fetch('/songs').then(res=>res.json()).then(data=>{
    const c=document.getElementById('songs');
    c.innerHTML='';
    data.forEach(song=>{
        c.innerHTML+=`
        <div class="card">
            <h3>${song.title}</h3>
            <audio controls src="${song.file}" onplay="triggerAd()"></audio><br>
            <a href="${song.file}" download onclick="triggerAd()">Download</a>
            
            <div class="ad-box">
            AD SPACE (AdSense banner here)
            </div>
        </div>`;
    });
});
</script>
